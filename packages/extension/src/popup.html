<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingglish</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="header">
      <a href="https://paultarjan.com/ingglish/" target="_blank" class="logo-link">
        <h1>Ingglish</h1>
      </a>
      <p class="subtitle">What if English spelling made sense?</p>
    </header>

    <div class="format-toggle">
      <label>Format:</label>
      <button id="format-btn" class="format-btn">Ingglish</button>
    </div>

    <div class="status">
      <div id="status-dot" class="status-dot"></div>
      <span id="status-text" class="status-text">Off</span>
    </div>

    <button id="toggle-btn" class="toggle-btn">
      Translate Page
    </button>

    <div class="info">
      <p>Phonetic English spelling for any webpage.</p>
    </div>

    <footer class="footer">
      <a href="https://paultarjan.com/ingglish/" target="_blank">Learn more</a>
    </footer>
  </div>

  <script src="popup.global.js"></script>

</html>
