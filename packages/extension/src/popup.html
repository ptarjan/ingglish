<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inglish</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="header">
      <h1>Inglish</h1>
      <p class="subtitle">Phonetic English Spelling</p>
    </header>

    <div class="status">
      <div id="status-dot" class="status-dot"></div>
      <span id="status-text" class="status-text">Off</span>
    </div>

    <button id="toggle-btn" class="toggle-btn">
      Translate Page
    </button>

    <div class="info">
      <p>Words are spelled exactly as they sound. No exceptions!</p>
    </div>

    <footer class="footer">
      <a href="https://inglish.example.com" target="_blank">Learn more</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
