<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ingglish - Phonetic English Spelling</title>
    <meta name="description" content="What if English spelling made sense? Ingglish is phonetic English — every letter makes one sound, always." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ingglish.com" />
    <meta property="og:title" content="Ingglish - What if English spelling made sense?" />
    <meta property="og:description" content="One spelling per sound. No silent letters. No exceptions. Translate any English text to phonetic spelling instantly." />
    <meta property="og:image" content="https://ingglish.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ingglish - What if English spelling made sense?" />
    <meta name="twitter:description" content="One spelling per sound. No silent letters. No exceptions. Translate any English text to phonetic spelling instantly." />
    <meta name="twitter:image" content="https://ingglish.com/og-image.png" />
    <script>
      // Apply theme immediately to prevent flash
      (function() {
        var themeMode = localStorage.getItem('themeMode') || 'auto';
        var isDark = themeMode === 'dark' || (themeMode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <!-- Static shell shown while JS loads, replaced by React -->
      <div class="app">
        <header class="header">
          <div class="header-title">
            <a class="logo-link" href="https://ingglish.com/">
              <img src="/logo.svg" alt="Ingglish logo" class="logo" width="56" height="56" />
              <h1>Ingglish</h1>
            </a>
          </div>
        </header>
        <div class="loading-screen" style="min-height: auto; flex: 1;">
          <div class="loading-spinner"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
