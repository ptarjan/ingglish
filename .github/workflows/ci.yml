name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================================================
  # FAST CHECKS - Run immediately in parallel (no build needed)
  # ============================================================================

  # Unit tests run via vitest which compiles TS on the fly
  # Dictionary is generated by pretest script
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache generated dictionaries
        uses: actions/cache@v5
        id: dict-cache-test
        with:
          path: |
            packages/core/src/dictionary/cmudict.js
            packages/core/src/dictionary/reverse-cmudict.js
            packages/core/src/data/word-frequencies.js
          key: dictionaries-v4-${{ hashFiles('packages/core/scripts/build-dictionary.ts') }}

      - name: Install dependencies
        run: npm ci

      - name: Generate dictionaries (if not cached)
        if: steps.dict-cache-test.outputs.cache-hit != 'true'
        run: npm run update-dictionaries -w @ingglish/core

      # Core, dom, website run without build (use TS paths to resolve source)
      - name: Unit tests (core + dom + website)
        run: npm run test -w @ingglish/core -w @ingglish/dom && npm run test:unit -w @ingglish/website

  # Basic lint checks (formatting, CSS) - no type checking needed
  lint-basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint CSS
        run: npm run lint:css

      - name: Check formatting
        run: npm run format:check

  # ============================================================================
  # BUILD - Generates artifacts needed for type-checking and e2e tests
  # ============================================================================

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache generated dictionaries
        uses: actions/cache@v5
        id: dict-cache
        with:
          path: |
            packages/core/src/dictionary/cmudict.js
            packages/core/src/dictionary/reverse-cmudict.js
            packages/core/src/data/word-frequencies.js
          key: dictionaries-v4-${{ hashFiles('packages/core/scripts/build-dictionary.ts') }}

      # Fast build: ESM only, no DTS (TypeScript paths resolve to source)
      # Note: build:fast includes update-dictionaries
      - name: Build core (ESM only)
        run: npm run build:fast -w @ingglish/core

      - name: Generate docs
        run: npm run docs

      # Run builds in parallel - website uses build:fast (skips tsc prebuild, done in lint)
      - name: Build other packages
        run: |
          npm run build -w @ingglish/cors-proxy &
          npm run build:fast -w @ingglish/dom &
          npm run build -w @ingglish/extension &
          npm run build:fast -w @ingglish/website &
          wait

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            packages/*/dist
            packages/core/src/dictionary/cmudict.js
            packages/core/src/dictionary/reverse-cmudict.js
            packages/core/src/data/word-frequencies.js
            packages/core/src/fallback/ipa-dict-supplement.ts
            docs/generated
          retention-days: 1

  # ============================================================================
  # POST-BUILD CHECKS - Need build artifacts (run in parallel)
  # ============================================================================

  # Type-aware linting needs .d.ts files
  typecheck:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .

      - name: Cache ESLint
        uses: actions/cache@v5
        with:
          path: packages/*/.eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js') }}
          restore-keys: eslint-${{ runner.os }}-

      - name: Lint (type-aware)
        run: npm run lint

  # Tests that need build artifacts (docs, extension)
  test-deps:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .

      # Docs link validation needs generated docs
      - name: Test docs links
        run: npm run test:docs -w @ingglish/website

      # Extension tests need @ingglish/core and @ingglish/dom built
      # Run from root so vitest resolves workspace projects correctly
      - name: Extension unit tests
        run: npx vitest run --no-color --project @ingglish/extension

  # Chromium e2e - runs on all events
  test-e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.. | .["@playwright/test"]? | .version? // empty' | head -1)" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Smoke test catches catastrophic failures fast before full suite
      - name: Smoke test
        run: cd packages/website && npx playwright test --project=chromium -g "displays header" --reporter=line

      - name: E2E tests (chromium)
        run: cd packages/website && npx playwright test --project=chromium --project=mobile-chrome

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium
          path: packages/website/test-results/
          retention-days: 7

  # Webkit e2e
  test-e2e-webkit:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.. | .["@playwright/test"]? | .version? // empty' | head -1)" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-webkit

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps webkit

      - name: Install Playwright deps (webkit needs them even when cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps webkit

      - name: E2E tests (webkit)
        run: cd packages/website && npx playwright test --project=mobile-safari

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-webkit
          path: packages/website/test-results/
          retention-days: 7
