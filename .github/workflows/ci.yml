name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # ============================================================================
  # FAST CHECKS - Run immediately in parallel (no build needed)
  # ============================================================================

  # Unit tests run via vitest which compiles TS on the fly
  # Dictionary is generated by pretest script
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          dict-cache: true

      - name: Unit tests
        run: npm test

  # All linting: CSS, formatting, type checking, and ESLint (type-aware)
  # None of these need build artifacts — TypeScript resolves workspace
  # packages to source via customConditions: ['source']
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          dict-cache: true

      - name: Lint CSS
        run: npm run lint:css

      - name: Check formatting
        run: npm run format:check

      - name: Cache ESLint
        uses: actions/cache@v5
        with:
          path: packages/*/.eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'package-lock.json') }}
          restore-keys: eslint-${{ runner.os }}-

      - name: Type check
        run: npx tsc --noEmit -p packages/website/tsconfig.json

      - name: Lint (type-aware)
        run: npx turbo lint

  # ============================================================================
  # BUILD - Generates artifacts needed for docs validation
  # ============================================================================

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          dict-cache: true

      - name: Generate docs
        run: npm run docs

      - name: Build
        run: npm run build:fast

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-output
          path: |
            packages/*/dist
            packages/dictionary/src/cmudict.js
            packages/dictionary/src/reverse-cmudict.js
            packages/dictionary/src/data/word-frequencies.js
            packages/website/public/ipa-dicts/
            docs/generated
          retention-days: 1

  # ============================================================================
  # POST-BUILD CHECK - Docs link validation (needs generated docs)
  # ============================================================================

  docs-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-output
          path: .

      - name: Test docs links
        run: npm run test:docs -w @ingglish/website

  # ============================================================================
  # E2E TESTS - Start immediately, build from turbo cache (no needs: build)
  # ============================================================================

  test-e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - browser: chromium
            projects: "chromium mobile-chrome"
          - browser: webkit
            projects: "mobile-safari"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          dict-cache: true

      # Build from turbo cache instead of waiting for build job + downloading artifacts
      - name: Generate docs
        run: npm run docs

      - name: Build (from turbo cache)
        run: npm run build:fast

      - uses: ./.github/actions/playwright
        with:
          browser: ${{ matrix.browser }}

      # Smoke test catches catastrophic failures fast before full suite (chromium only)
      - name: Smoke test
        if: matrix.browser == 'chromium'
        run: cd packages/website && npx playwright test --project=chromium -g "displays header" --reporter=line

      - name: E2E tests (${{ matrix.browser }})
        run: |
          cd packages/website
          args=""
          for p in ${{ matrix.projects }}; do args="$args --project=$p"; done
          npx playwright test $args

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.browser }}
          path: packages/website/test-results/
          retention-days: 7
