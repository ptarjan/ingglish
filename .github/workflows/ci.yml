name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================================================
  # FAST CHECKS - Run immediately in parallel (no build needed)
  # ============================================================================

  # Unit tests run via vitest which compiles TS on the fly
  # Dictionary is generated by pretest script
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          dict-cache: true

      # Run all workspace test scripts automatically (no manual package list to maintain).
      - name: Unit tests
        run: npm test --workspaces --if-present

  # Basic lint checks (formatting, CSS) - no type checking needed
  lint-basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Lint CSS
        run: npm run lint:css

      - name: Check formatting
        run: npm run format:check

  # ============================================================================
  # BUILD - Generates artifacts needed for type-checking and e2e tests
  # ============================================================================

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          dict-cache: true

      - name: Generate docs
        run: npm run docs

      - name: Build
        run: npm run build:fast

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-output
          path: |
            packages/*/dist
            packages/dictionary/src/cmudict.js
            packages/dictionary/src/reverse-cmudict.js
            packages/dictionary/src/data/word-frequencies.js
            docs/generated
          retention-days: 1

  # ============================================================================
  # POST-BUILD CHECKS - Need build artifacts (run in parallel)
  # ============================================================================

  # Type-aware linting needs .d.ts files
  typecheck:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-output
          path: .

      - name: Cache ESLint
        uses: actions/cache@v5
        with:
          path: packages/*/.eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js') }}
          restore-keys: eslint-${{ runner.os }}-

      - name: Type check
        run: npx tsc --noEmit -p packages/website/tsconfig.json

      - name: Lint (type-aware)
        run: npm run lint

  # Tests that need build artifacts (docs, extension)
  test-deps:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-output
          path: .

      # Docs link validation needs generated docs
      - name: Test docs links
        run: npm run test:docs -w @ingglish/website

  # E2E tests - chromium and webkit via matrix
  test-e2e:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        include:
          - browser: chromium
            projects: "chromium mobile-chrome"
          - browser: webkit
            projects: "mobile-safari"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-output
          path: .

      - uses: ./.github/actions/playwright
        with:
          browser: ${{ matrix.browser }}

      # Smoke test catches catastrophic failures fast before full suite (chromium only)
      - name: Smoke test
        if: matrix.browser == 'chromium'
        run: cd packages/website && npx playwright test --project=chromium -g "displays header" --reporter=line

      - name: E2E tests (${{ matrix.browser }})
        run: |
          cd packages/website
          args=""
          for p in ${{ matrix.projects }}; do args="$args --project=$p"; done
          npx playwright test $args

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.browser }}
          path: packages/website/test-results/
          retention-days: 7
