name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # ============================================================================
  # FAST CHECKS - Run immediately in parallel (no build needed)
  # ============================================================================

  # Unit tests run via vitest which compiles TS on the fly
  # Dictionary is generated by pretest script
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          dict-cache: true

      - name: Generate docs
        run: npm run docs

      - name: Unit tests
        run: npm test -- -- --coverage

      - name: IPA dict coverage tests
        run: npx turbo test:dict-coverage

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5
        with:
          files: packages/*/coverage/coverage-final.json
          fail_ci_if_error: false

  # CLI integration tests — split across runners since each test spawns CPU-bound subprocesses
  test-cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - scope: ingglish
            name: core
            shard: 1/2
          - scope: ingglish
            name: core
            shard: 2/2
          - scope: "@ingglish/dom"
            name: dom
            shard: ""
          - scope: "@ingglish/dictionary"
            name: dictionary
            shard: ""
    name: test-cli (${{ matrix.name }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          dict-cache: true

      - name: CLI integration tests
        run: |
          shard_arg=""
          if [ -n "${{ matrix.shard }}" ]; then shard_arg="-- --shard=${{ matrix.shard }}"; fi
          npx turbo test:cli --filter=${{ matrix.scope }} $shard_arg

  # Detect dead code, unused exports, and missing dependencies
  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Check for dead code
        run: npm run knip

  # All linting: CSS, formatting, type checking, and ESLint (type-aware)
  # None of these need build artifacts — TypeScript resolves workspace
  # packages to source via customConditions: ['source']
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          dict-cache: true

      - name: Lint CSS
        run: npm run lint:css

      - name: Check formatting
        run: npm run format:check

      - name: Cache ESLint
        uses: actions/cache@v5
        with:
          path: packages/*/.eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'package-lock.json') }}
          restore-keys: eslint-${{ runner.os }}-

      - name: Type check
        run: npx tsc --noEmit -p packages/website/tsconfig.json

      - name: Check for large files
        run: |
          max_kb=500
          oversized=$(git ls-files -z | xargs -0 -I{} sh -c 'size=$(wc -c < "{}"); if [ "$size" -gt '$((max_kb * 1024))' ]; then echo "  {}: $((size / 1024))KB"; fi')
          if [ -n "$oversized" ]; then
            echo "❌ Files exceeding ${max_kb}KB limit:"
            echo "$oversized"
            exit 1
          fi

      - name: Lint (type-aware)
        run: npx turbo lint

  # ============================================================================
  # BUILD - Generates artifacts needed for docs validation
  # ============================================================================

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          dict-cache: true

      - name: Generate docs
        run: npm run docs

      - name: Build
        run: npm run build:fast

      - name: Report bundle sizes
        run: |
          echo "## Bundle Sizes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Raw | Gzipped |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----:|--------:|" >> $GITHUB_STEP_SUMMARY
          for f in packages/website/dist/assets/*.{js,css}; do
            name=$(basename "$f")
            # Skip dictionary data files
            case "$name" in
              cmudict-*|reverse-cmudict-*|word-frequencies-*) continue ;;
            esac
            # Strip 8-char Vite content hash (e.g. ingglish-CQyOYrI1.js → ingglish.js)
            clean=$(echo "$name" | sed 's/-[A-Za-z0-9_-]\{8\}\./\./')
            raw=$(wc -c < "$f" | awk '{printf "%.1f kB", $1/1024}')
            gz=$(gzip -c "$f" | wc -c | awk '{printf "%.1f kB", $1/1024}')
            echo "| \`$clean\` | $raw | $gz |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@fcd65974f7c4c2bf0ee9d09b84d2489183c29726 # v12
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            packages/*/dist
            packages/dictionary/src/cmudict.js
            packages/dictionary/src/reverse-cmudict.js
            packages/dictionary/src/data/word-frequencies.js
            packages/website/public/ipa-dicts/
          retention-days: 1

  # ============================================================================
  # E2E TESTS - Start immediately, build from turbo cache (no needs: build)
  # ============================================================================

  test-e2e:
    runs-on: ubuntu-latest
    # Playwright container includes browsers + system deps, skipping install-deps
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    strategy:
      matrix:
        include:
          - browser: chromium
            projects: "chromium mobile-chrome"
            shard: 1/2
          - browser: chromium
            projects: "chromium mobile-chrome"
            shard: 2/2
          - browser: webkit
            projects: "mobile-safari"
            shard: 1/2
          - browser: webkit
            projects: "mobile-safari"
            shard: 2/2
    name: test-e2e (${{ matrix.browser }} ${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          dict-cache: true

      # Build from turbo cache instead of waiting for build job + downloading artifacts
      - name: Generate docs
        run: npm run docs

      - name: Build (from turbo cache)
        run: npm run build:fast

      # Smoke test catches catastrophic failures fast before full suite (chromium shard 1 only)
      - name: Smoke test
        if: matrix.shard == '1/2'
        run: cd packages/website && npx playwright test --project=chromium -g "displays header" --reporter=line

      - name: E2E tests
        run: |
          cd packages/website
          args=""
          for p in ${{ matrix.projects }}; do args="$args --project=$p"; done
          args="$args --shard=${{ matrix.shard }}"
          npx playwright test $args

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: packages/website/test-results/
          retention-days: 7
