name: CI

on:
  push:
    branches: [main, master, claude/url-translator-shared-lib-hNsxZ]
  pull_request:
    branches: [main, master]

jobs:
  # ============================================================================
  # FAST CHECKS - Run immediately in parallel (no build needed)
  # ============================================================================

  # Unit tests run via vitest which compiles TS on the fly
  # Dictionary is generated by pretest script
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache generated dictionaries
        uses: actions/cache@v4
        with:
          path: |
            packages/core/src/dictionary/cmudict.ts
            packages/core/src/dictionary/reverse-cmudict.ts
            packages/core/src/data/word-frequencies.ts
          key: dictionaries-${{ hashFiles('packages/core/scripts/*.ts', 'packages/core/package.json') }}

      - name: Install dependencies
        run: npm ci

      # Only core and website - extension needs build artifacts
      - name: Unit tests (core + website)
        run: npm run test:unit -w @ingglish/core -w @ingglish/website

  # Basic lint checks (formatting, CSS) - no type checking needed
  lint-basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint CSS
        run: npm run lint:css

      - name: Check formatting
        run: npm run format:check

  # ============================================================================
  # BUILD - Generates artifacts needed for type-checking and e2e tests
  # ============================================================================

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache generated dictionaries
        uses: actions/cache@v4
        id: dict-cache
        with:
          path: |
            packages/core/src/dictionary/cmudict.ts
            packages/core/src/dictionary/reverse-cmudict.ts
            packages/core/src/data/word-frequencies.ts
          key: dictionaries-${{ hashFiles('packages/core/scripts/*.ts', 'packages/core/package.json') }}

      # Profile build steps individually
      - name: Build core (includes dictionary generation)
        run: npm run build -w @ingglish/core

      - name: Generate docs
        run: npm run docs

      - name: Build other packages
        run: npm run build -w @ingglish/cors-proxy -w @ingglish/dom -w @ingglish/extension -w @ingglish/website

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            packages/*/dist
            packages/core/src/dictionary/cmudict.ts
            packages/core/src/dictionary/reverse-cmudict.ts
            packages/core/src/data/word-frequencies.ts
            packages/core/src/fallback/ipa-dict-supplement.ts
            docs/generated
          retention-days: 1

  # ============================================================================
  # POST-BUILD CHECKS - Need build artifacts
  # ============================================================================

  # Type-aware ESLint rules need .d.ts files from build
  lint-typecheck:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .

      - name: Lint (type-aware)
        run: npm run lint

      # Docs link validation needs generated docs (excluded from regular unit tests)
      - name: Test docs links
        run: npm run test:docs -w @ingglish/website

      # DOM and extension tests need @ingglish/core built
      - name: DOM unit tests
        run: npm run test:unit -w @ingglish/dom

      - name: Extension unit tests
        run: npm run test:unit -w @ingglish/extension

  # Browser tests need the built website
  test-e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.. | .["@playwright/test"]? | .version? // empty' | head -1)" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium-webkit

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright deps (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      # NOTE: Smoke test catches catastrophic failures fast (e.g., app won't start)
      # before waiting for the full suite. Useful for quick feedback on broken builds.
      - name: Smoke test (1 browser, 1 test)
        run: cd packages/website && npx playwright test --project=chromium -g "displays header" --reporter=line

      - name: E2E tests (full suite)
        run: npm run test:e2e -w @ingglish/website

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/website/test-results/
          retention-days: 7

  deploy-preview:
    runs-on: ubuntu-latest
    needs: [build, lint-basic, lint-typecheck, test-unit, test-e2e]
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .

      - name: Deploy to Vercel Preview
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: packages/website

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build, lint-basic, lint-typecheck, test-unit, test-e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .

      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: packages/website
