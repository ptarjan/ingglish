name: CI

on:
  push:
    branches: [main, master, claude/url-translator-shared-lib-hNsxZ]
  pull_request:
    branches: [main, master]

jobs:
  # ============================================================================
  # FAST CHECKS - Run immediately in parallel (no build needed)
  # ============================================================================

  # Unit tests run via vitest which compiles TS on the fly
  # Dictionary is generated by pretest script
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache generated dictionaries
        uses: actions/cache@v4
        with:
          path: |
            packages/core/src/dictionary/cmudict.ts
            packages/core/src/dictionary/reverse-cmudict.ts
            packages/core/src/data/word-frequencies.ts
          key: dictionaries-${{ hashFiles('packages/core/scripts/build-dictionary.ts') }}

      - name: Install dependencies
        run: npm ci

      # Core, dom, website run without build (use TS paths to resolve source)
      - name: Unit tests (core + dom + website)
        run: npm run test:unit -w @ingglish/core -w @ingglish/dom -w @ingglish/website

  # Basic lint checks (formatting, CSS) - no type checking needed
  lint-basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint CSS
        run: npm run lint:css

      - name: Check formatting
        run: npm run format:check

  # ============================================================================
  # BUILD - Generates artifacts needed for type-checking and e2e tests
  # ============================================================================

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache generated dictionaries
        uses: actions/cache@v4
        id: dict-cache
        with:
          path: |
            packages/core/src/dictionary/cmudict.ts
            packages/core/src/dictionary/reverse-cmudict.ts
            packages/core/src/data/word-frequencies.ts
          key: dictionaries-${{ hashFiles('packages/core/scripts/build-dictionary.ts') }}

      # Fast build: ESM only, no DTS (TypeScript paths resolve to source)
      # Note: build:fast includes update-dictionaries
      - name: Build core (ESM only)
        run: npm run build:fast -w @ingglish/core

      - name: Generate docs
        run: npm run docs

      # Run builds in parallel - website uses build:fast (skips tsc prebuild, done in lint)
      - name: Build other packages
        run: |
          npm run build -w @ingglish/cors-proxy &
          npm run build:fast -w @ingglish/dom &
          npm run build -w @ingglish/extension &
          npm run build:fast -w @ingglish/website &
          wait

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            packages/*/dist
            packages/core/src/dictionary/cmudict.ts
            packages/core/src/dictionary/reverse-cmudict.ts
            packages/core/src/data/word-frequencies.ts
            packages/core/src/fallback/ipa-dict-supplement.ts
            docs/generated
          retention-days: 1

  # ============================================================================
  # POST-BUILD CHECKS - Need build artifacts (run in parallel)
  # ============================================================================

  # Type-aware linting needs .d.ts files
  typecheck:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .

      - name: Lint (type-aware)
        run: npm run lint

  # Tests that need build artifacts (docs, extension)
  test-deps:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .

      # Docs link validation needs generated docs
      - name: Test docs links
        run: npm run test:docs -w @ingglish/website

      # Extension tests need @ingglish/core and @ingglish/dom built
      - name: Extension unit tests
        run: npm run test:unit -w @ingglish/extension

  # Browser tests need the built website - run browsers in parallel
  test-e2e:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            project_flags: --project=chromium --project=mobile-chrome
          - browser: webkit
            project_flags: --project=mobile-safari
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.. | .["@playwright/test"]? | .version? // empty' | head -1)" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ matrix.browser }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # Webkit needs system deps even when cached (chromium works without)
      - name: Install Playwright deps (webkit only)
        if: steps.playwright-cache.outputs.cache-hit == 'true' && matrix.browser == 'webkit'
        run: npx playwright install-deps webkit

      # Smoke test catches catastrophic failures fast before full suite
      - name: Smoke test
        if: matrix.browser == 'chromium'
        run: cd packages/website && npx playwright test --project=chromium -g "displays header" --reporter=line

      - name: E2E tests (${{ matrix.browser }})
        run: cd packages/website && npx playwright test ${{ matrix.project_flags }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: packages/website/test-results/
          retention-days: 7

  deploy-preview:
    runs-on: ubuntu-latest
    needs: [build, lint-basic, typecheck, test-deps, test-unit, test-e2e]
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .

      - name: Deploy to Vercel Preview
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: packages/website

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build, lint-basic, typecheck, test-deps, test-unit, test-e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .

      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: packages/website
