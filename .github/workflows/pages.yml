name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          dict-cache: true

      - name: Cache generated docs
        id: docs-cache
        uses: actions/cache@v5
        with:
          path: docs/generated
          key: docs-${{ hashFiles('packages/*/src/**/*.ts', 'typedoc.json') }}

      - name: Build libraries
        run: npm run build:fast

      - name: Generate docs
        if: steps.docs-cache.outputs.cache-hit != 'true'
        run: npm run docs

      - name: Build extension and package zip
        run: |
          npm run build -w @ingglish/extension
          cd packages/extension/dist && zip -r ../../website/public/ingglish-extension.zip .

      - name: Build website for GitHub Pages
        run: npm run build:fast -w @ingglish/website
        env:
          BASE_URL: /
          VITE_CORS_PROXY_URL: https://ingglish-cors-proxy.curly-unit-b9e0.workers.dev/?url=

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: packages/website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
