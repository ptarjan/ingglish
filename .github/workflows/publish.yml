name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          dict-cache: true
          registry-url: 'https://registry.npmjs.org'

      - name: Test
        run: npm test --workspaces --if-present

      - name: Build
        run: npm run build:libs && npm run build -w @ingglish/dom

      - name: Publish packages
        run: |
          for pkg in normalize phonemes tokenize dictionary g2p fallback core dom; do
            npm publish --workspace=packages/$pkg --access public --provenance
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
