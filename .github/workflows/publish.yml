name: Publish to npm

on:
  release:
    types: [published]

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup
        with:
          dict-cache: true
          registry-url: 'https://registry.npmjs.org'

      - name: Generate docs
        run: npm run docs

      - name: Test
        run: npm test

      - name: Build
        run: npx turbo build

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Publish packages
        run: |
          for pkg in normalize phonemes dictionary g2p ipa shavian deseret fallback core dom; do
            npm publish --workspace=packages/$pkg --access public --provenance
          done
