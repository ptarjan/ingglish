name: Setup Node.js and install dependencies
description: Setup Node.js, install npm dependencies, and optionally cache/generate dictionaries

inputs:
  dict-cache:
    description: Whether to cache and conditionally generate dictionaries
    required: false
    default: 'false'
  registry-url:
    description: npm registry URL (needed for publishing)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        registry-url: ${{ inputs.registry-url }}

    - name: Cache node_modules
      id: nm-cache
      uses: actions/cache@v5
      with:
        path: |
          node_modules
          packages/*/node_modules
        key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Cache generated dictionaries
      if: inputs.dict-cache == 'true'
      uses: actions/cache@v5
      id: dict-cache
      with:
        path: |
          packages/dictionary/src/cmudict.js
          packages/dictionary/src/reverse-cmudict.js
          packages/dictionary/src/data/word-frequencies.js
        key: dictionaries-v5-${{ hashFiles('packages/dictionary/scripts/build-dictionary.ts') }}

    - name: Cache Turbo
      uses: actions/cache@v5
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ hashFiles('packages/*/src/**') }}
        restore-keys: turbo-${{ runner.os }}-

    - name: Install dependencies
      if: steps.nm-cache.outputs.cache-hit != 'true'
      run: npm ci
      shell: bash

    - name: Generate dictionaries (if not cached)
      if: inputs.dict-cache == 'true' && steps.dict-cache.outputs.cache-hit != 'true'
      run: npm run update-dictionaries -w @ingglish/dictionary
      shell: bash

    - name: Cache IPA dictionaries
      if: inputs.dict-cache == 'true'
      uses: actions/cache@v5
      id: ipa-dict-cache
      with:
        path: packages/website/public/ipa-dicts/
        key: ipa-dicts-v1-${{ hashFiles('packages/website/scripts/build-ipa-dicts.ts') }}

    - name: Generate IPA dictionaries (if not cached)
      if: inputs.dict-cache == 'true' && steps.ipa-dict-cache.outputs.cache-hit != 'true'
      run: node packages/website/scripts/ensure-ipa-dicts.cjs
      shell: bash
