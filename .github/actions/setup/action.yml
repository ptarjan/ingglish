name: Setup Node.js and install dependencies
description: Setup Node.js, install npm dependencies, and optionally cache/generate dictionaries

inputs:
  dict-cache:
    description: Whether to cache and conditionally generate dictionaries
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'

    - name: Cache generated dictionaries
      if: inputs.dict-cache == 'true'
      uses: actions/cache@v5
      id: dict-cache
      with:
        path: |
          packages/dictionary/src/cmudict.js
          packages/dictionary/src/reverse-cmudict.js
          packages/dictionary/src/data/word-frequencies.js
        key: dictionaries-v5-${{ hashFiles('packages/dictionary/scripts/build-dictionary.ts') }}

    - name: Install dependencies
      run: npm ci
      shell: bash

    - name: Generate dictionaries (if not cached)
      if: inputs.dict-cache == 'true' && steps.dict-cache.outputs.cache-hit != 'true'
      run: npm run update-dictionaries -w @ingglish/dictionary
      shell: bash
