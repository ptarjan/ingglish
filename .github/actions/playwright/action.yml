name: Install Playwright browser
description: Get Playwright version, cache browser binaries, and install if needed

inputs:
  browser:
    description: Browser to install (chromium or webkit)
    required: true

runs:
  using: composite
  steps:
    - name: Get Playwright version
      id: playwright-version
      run: echo "version=$(npm ls @playwright/test --json | jq -r '.. | .["@playwright/test"]? | .version? // empty' | head -1)" >> $GITHUB_OUTPUT
      shell: bash

    - name: Cache Playwright browsers
      uses: actions/cache@v5
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ inputs.browser }}

    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps ${{ inputs.browser }}
      shell: bash

    - name: Install Playwright deps (needed even when cached)
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps ${{ inputs.browser }}
      shell: bash
